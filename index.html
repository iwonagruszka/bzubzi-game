<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bzubzi Adventure — Small Adventures Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-a: #DCE0EC;
    --bg-b: #FAF0E5;
    --panel: #FFFDFA;
    --ink: #3A4A6B;
    --ink-soft: #7B8AAB;
    --brand: #7B8AAB;
    --brand-dark: #4E5E80;
    --accent: #D4A857;
    --accent-dark: #B0863B;
    --gold: #D4A857;
    --good: #7B8AAB;
    --line: #E7DAC8;
    --danger: #C98B7F;
    --sky-top: #DCE0EC;
    --sky-bottom: #FAF0E5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Manrope', sans-serif;
    background:transparent;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0;
  }
  .widget{
    width:100%; max-width:460px; background:var(--panel); border-radius:28px;
    box-shadow: 0 2px 0 rgba(255,255,255,.6) inset;
    overflow:hidden; position:relative; min-height:660px; display:flex; flex-direction:column;
  }
  .screen{ padding:26px 24px 24px; display:flex; flex-direction:column; flex:1; animation: fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  h1,h2,h3{ font-family:'Baloo 2', sans-serif; margin:0; line-height:1.15; }
  h1{ font-size:25px; font-weight:800; color:var(--brand-dark); }
  h2{ font-size:19px; font-weight:700; color:var(--ink); }
  p{ margin:0; }
  .muted{ color:var(--ink-soft); font-size:13.5px; line-height:1.5; }

  .mascot{ font-size:52px; display:block; text-align:center; margin:4px 0 2px; filter:drop-shadow(0 8px 10px rgba(123,138,171,.30)); }

  .btn{
    appearance:none; border:none; cursor:pointer;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:16px;
    padding:13px 20px; border-radius:16px;
    background:var(--accent); color:#fff;
    box-shadow: 0 6px 0 var(--accent-dark);
    transition: transform .08s ease;
  }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--accent-dark); }
  .btn.secondary{ background:#F2E4E4; color:var(--brand-dark); box-shadow:0 6px 0 #D8C2C2; }
  .btn.secondary:active{ box-shadow:0 2px 0 #D8C2C2; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; box-shadow:0 6px 0 rgba(0,0,0,.1); }
  .btn-row{ display:flex; gap:10px; margin-top:auto; padding-top:16px; }
  .btn-row .btn{ flex:1; }

  input[type=text], input[type=email]{
    width:100%; font-family:'Manrope',sans-serif; font-size:15px;
    padding:12px 14px; border-radius:14px; border:2px solid var(--line);
    background:#FBF6F6; color:var(--ink); font-weight:600;
  }
  input:focus{ outline:none; border-color:var(--brand); }
  label{ font-size:13px; font-weight:700; color:var(--ink-soft); display:block; margin:12px 0 6px; }

  .avatar-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:6px; }
  .avatar-opt{
    height:48px; font-size:24px; text-align:center; border-radius:14px;
    border:2px solid var(--line); background:#FBF6F6; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .avatar-opt.selected{ border-color:var(--brand); background:#EDE3D3; box-shadow:0 0 0 3px rgba(212,168,87,.28); }
  .avatar-opt.img-opt img{ max-height:40px; max-width:34px; width:auto; height:auto; object-fit:contain; display:block; }
  .mascot img{ height:96px; width:auto; display:block; margin:0 auto; filter:drop-shadow(0 8px 10px rgba(123,138,171,.30)); }

  .legend{ display:flex; gap:14px; justify-content:center; margin:10px 0 4px; flex-wrap:wrap; }
  .legend-block{ width:100%; margin:10px 0 2px; }
  .legend-title{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; text-align:center; margin-bottom:6px; }
  .legend-title.danger-title{ color:var(--danger); }
  .legend-title.good-title{ color:var(--brand); }
  .legend-grid{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px; }
  .legend-grid span{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
    color:var(--ink-soft); background:#FBF6F6; border:1px solid var(--line);
    padding:4px 9px; border-radius:999px; }
  .legend-grid span i{ font-style:normal; font-size:14px; }
  .legend-grid span b{ color:var(--brand); font-weight:800; }
  .legend span{ font-size:12px; color:var(--ink-soft); font-weight:700; display:flex; align-items:center; gap:4px; }

  /* Gra */
  .hud{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .hud .coin{ font-family:'Baloo 2',sans-serif; font-weight:800; color:var(--brand-dark); display:flex; align-items:center; gap:6px; font-size:15px; }
  .hud .coin .dot{ width:20px; height:20px; border-radius:50%; background:var(--gold); display:inline-flex; align-items:center; justify-content:center; font-size:11px; }
  .hud .lives{ font-size:16px; letter-spacing:2px; }

  .progress-track{ width:100%; height:10px; background:#E8DADA; border-radius:999px; overflow:hidden; margin-bottom:10px; }
  .progress-track > div{ height:100%; background:linear-gradient(90deg, var(--brand), var(--accent)); width:0%; transition:width .12s linear; }

  .hint{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:8px; }

  .badge{
    font-family:'Baloo 2',
    sans-serif; 
    font-weight:800; 
    font-size:21px; 
    text-align: center;
    color:#B0863B;
    padding:15px; 
    border-radius:18px; 
    margin:10px 0;
  }

  table.lb{ width:100%; border-collapse:collapse; margin-top:8px; }
  table.lb td{ padding:9px 6px; border-bottom:1px solid #EDE0E0; font-size:14px; }
  table.lb tr.me{ background:#EDE3D3; font-weight:800; border-radius:10px; }
  table.lb td.rank{ font-family:'Baloo 2',sans-serif; font-weight:800; color:var(--ink-soft); width:26px; }
  table.lb td.pts{ text-align:right; font-weight:800; color:var(--brand-dark); }

  .footer-links{ display:flex; justify-content:center; gap:14px; margin-top:14px; }
  .footer-links a{ font-size:12px; color:var(--ink-soft); text-decoration:none; }

  .confetti{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:5; }
  .confetti span{ position:absolute; top:-10%; font-size:16px; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(700px) rotate(360deg); opacity:0; } }

  .cta-card{ width:100%; margin:14px 0 4px; padding:16px 14px; border-radius:16px; text-align:center;
    background:linear-gradient(150deg, #E7ECF5, #FAF0E5); border:1px solid var(--line); }
  .cta-head{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:16px; line-height:1.3;
    color:var(--brand-dark); margin-bottom:6px; }
  .cta-body{ font-size:12.5px; line-height:1.5; color:var(--ink-soft); font-weight:600; margin:0 0 12px; }
  .cta-btn{ display:block; text-decoration:none; text-align:center; }
  .cta-note{ font-size:10.5px; color:var(--ink-soft); opacity:.85; font-weight:700; margin-top:7px; }
  .consent{ margin-top:12px; padding:12px; background:#FBF6F6; border:1px solid var(--line); border-radius:12px; }
  .consent-row{ display:flex; align-items:flex-start; gap:9px; margin-bottom:10px; cursor:pointer;
    font-size:11.5px; line-height:1.45; color:var(--ink-soft); font-weight:600; text-transform:none; letter-spacing:0; }
  .consent-row:last-of-type{ margin-bottom:0; }
  .consent-row input[type="checkbox"]{ width:17px; height:17px; margin:1px 0 0; flex:0 0 auto;
    accent-color:var(--brand); cursor:pointer; }
  .consent-row a{ color:var(--brand); font-weight:800; }
  .consent-row.optin{ background:#F3EAD9; border:1px solid #E0C99A; border-radius:10px; padding:9px 10px; margin-top:2px; }
  .consent-row.optin b{ color:var(--brand-dark); font-weight:800; }

  .consent-row .req{ color:var(--danger); font-weight:800; }
  .consent-row em{ font-style:normal; color:var(--ink-soft); opacity:.8; }
  .small-note{ font-size:11px; color:var(--ink-soft); margin-top:8px; text-align:center; }
</style>

const app = document.getElementById('widget');

function toast(msg){
  const t = document.createElement('div');
  t.style.position='absolute'; t.style.top='14px'; t.style.left='50%';
  t.style.transform='translateX(-50%)'; t.style.background='var(--ink)'; t.style.color='#fff';
  t.style.fontWeight='700'; t.style.fontSize='13px'; t.style.padding='8px 16px'; t.style.borderRadius='999px';
  t.style.zIndex='20'; t.textContent = msg;
  app.appendChild(t);
  setTimeout(()=> t.remove(), 1200);
}

function confettiBurst(){
  const wrap = document.createElement('div');
  wrap.className='confetti';
  const bits = ['🎉','✨','🎊','⭐','🟡','🟣'];
  for(let i=0;i<24;i++){
    const s = document.createElement('span');
    s.textContent = bits[Math.floor(Math.random()*bits.length)];
    s.style.left = Math.random()*100+'%';
    s.style.animationDuration = (1.4+Math.random()*1.2)+'s';
    s.style.animationDelay = (Math.random()*.4)+'s';
    wrap.appendChild(s);
  }
  app.appendChild(wrap);
  setTimeout(()=>wrap.remove(), 2600);
}

function badgeFor(score){
  if(score>=550) return 'Master Dream-Catcher 🏆';
  if(score>=400) return 'Star Collector 🥇';
  if(score>=250) return 'Adventure Buddy 🥈';
  return 'Little Explorer 🥉';
}

  const nickInput = document.getElementById('nickInput');

/* ---------------- MAILCHIMP SUBSCRIBE ----------------
   Uses Mailchimp's JSONP endpoint so it works from a static
   page with no backend and no API key exposed.
   Requires CONFIG.MAILCHIMP_ACTION to be set (see top of file).
   Recommended: enable DOUBLE OPT-IN in your Mailchimp audience.
   ---------------------------------------------------------
   Merge fields to create in Mailchimp (Audience > Settings >
   Audience fields and *|MERGE|* tags):
     NICK      (text)  - player nickname
     CONSENTTS (text)  - consent timestamp, ISO 8601
     CONSENTTX (text)  - exact consent wording shown
   Marketing consent is sent as a Mailchimp GDPR/interest flag
   via MARKETING (text: yes/no) so you can segment on it.
   ----------------------------------------------------------- */
function subscribeToMailchimp(){
  if(!CONFIG.MAILCHIMP_ACTION){
    console.warn('[Bzubzi Adventure] CONFIG.MAILCHIMP_ACTION is empty - e-mail not sent. Add your Mailchimp URL at the top of this file.');
    return;
  }
  // Only marketing-consented players are sent to Mailchimp.
  // Everyone else plays the game; their e-mail is never transmitted.
  if(!state.consentPrivacy) return;
  if(!state.consentMarketing) return;

  const params = new URLSearchParams({
    EMAIL: state.email,
    NICK: state.nick,
    CONSENTTS: state.consentTimestamp,
    CONSENTTX: state.consentTextShown.slice(0, 240),
    MARKETING: state.consentMarketing ? 'yes' : 'no',
  });

  const cb = 'mcCallback_' + Date.now();
  window[cb] = (res)=>{
    if(res && res.result === 'error'){
      console.warn('[Mailchimp]', res.msg);
    }
    delete window[cb];
    if(s.parentNode) s.parentNode.removeChild(s);
  };

  const sep = CONFIG.MAILCHIMP_ACTION.includes('?') ? '&' : '?';
  const s = document.createElement('script');
  s.src = CONFIG.MAILCHIMP_ACTION + sep + params.toString() + '&c=' + cb;
  s.onerror = ()=>{ console.warn('[Mailchimp] request failed'); delete window[cb]; };
  document.body.appendChild(s);
}

/* ---------------- GAME (canvas runner) ---------------- */

const CANVAS_W = 412, CANVAS_H = 300;
const GROUND_Y = 235;
const GRAVITY = 0.9;
const JUMP_V = -15;
const PLAYER_X = 55;
const PLAYER_SIZE = 38;
const FINISH_DISTANCE = 3200;



let g = null; // current run state object
let rafId = null;
let lastT = 0;
let keyHandlerAttached = false;

function resetRun(){
  g = {
    speed: 4.2,
    distance: 0,
    lives: 3,
    coinScore: 0,
    invuln: 0,
    over: false,
    result: null, // 'finish' | 'gameover'
    spawnTimer: 40,
    entities: [],
    particles: [],
    player: { y: GROUND_Y - PLAYER_SIZE, vy: 0, jumping:false, blink:0 },
  };
}

function jump(){
  if(!g || g.over) return;
  if(!g.player.jumping){
    g.player.vy = JUMP_V;
    g.player.jumping = true;
  }
}

function attachControlsOnce(){
  if(keyHandlerAttached) return;
  keyHandlerAttached = true;
  window.addEventListener('keydown', (e)=>{
    if(state.screen !== 'play') return;
    if(e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      jump();
    }
  });
}

function renderPlay(){
  app.innerHTML = `
    <div class="screen">
      <div class="hud">
        <div class="coin"><span class="dot">⭐</span> <span id="scoreVal">0</span> stars</div>
        <div class="lives" id="livesVal">❤️❤️❤️</div>
      </div>
      <div class="progress-track"><div id="distFill" style="width:0%"></div></div>
      <canvas id="game" width="${CANVAS_W}" height="${CANVAS_H}"></canvas>
      <p class="hint">Space / arrow up / tap the screen = jump</p>
    </div>`;

  attachControlsOnce();
  resetRun();

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  canvas.addEventListener('pointerdown', (e)=>{ e.preventDefault(); jump(); });

  const scoreEl = document.getElementById('scoreVal');
  const livesEl = document.getElementById('livesVal');
  const distEl = document.getElementById('distFill');

  function spawnEntity(){
    const roll = Math.random();
    if(roll < 0.42){
      const def = OBSTACLES[Math.floor(Math.random()*OBSTACLES.length)];
      g.entities.push({ type:'obstacle', emoji:def.emoji, x: CANVAS_W + 20, y: GROUND_Y - 34, w:34, h:34 });
    } else if(roll < 0.72){
      const def = COLLECT_GROUND[Math.floor(Math.random()*COLLECT_GROUND.length)];
      g.entities.push({ type:'collect', emoji:def.emoji, value:def.value, x: CANVAS_W + 20, y: GROUND_Y - 30, w:28, h:28 });
    } else {
      const def = COLLECT_AIR[Math.floor(Math.random()*COLLECT_AIR.length)];
      g.entities.push({ type:'collect', emoji:def.emoji, value:def.value, x: CANVAS_W + 20, y: GROUND_Y - 105, w:30, h:30 });
    }
    g.spawnTimer = 46 + Math.random()*30;
  }

  function overlap(px,py,pw,ph, ex,ey,ew,eh){
    return px < ex+ew && px+pw > ex && py < ey+eh && py+ph > ey;
  }

  function endRun(result){
    if(g.over) return;
    g.over = true;
    g.result = result;
    stopLoop();
    const bonus = result === 'finish' ? 150 + g.lives*30 : g.lives*20;
    state.score = g.coinScore + bonus;
    setTimeout(()=>{ state.screen='result'; render(); }, 350);
  }

  function update(dt){
    if(g.over) return;
    // predkosc rosnie z dystansem
    g.speed = Math.min(9, 4.2 + g.distance/1400);
    g.distance += g.speed * dt;

    // fizyka gracza
    const p = g.player;
    p.vy += GRAVITY * dt;
    p.y += p.vy * dt;
    if(p.y >= GROUND_Y - PLAYER_SIZE){
      p.y = GROUND_Y - PLAYER_SIZE;
      p.vy = 0;
      p.jumping = false;
    }
    if(g.invuln > 0) g.invuln -= dt;

    // spawn
    g.spawnTimer -= dt;
    if(g.spawnTimer <= 0) spawnEntity();

    // ruch encji + kolizje
    for(let i=g.entities.length-1; i>=0; i--){
      const e = g.entities[i];
      e.x -= g.speed * dt * 1.6;
      const hit = overlap(PLAYER_X, p.y, PLAYER_SIZE, PLAYER_SIZE, e.x, e.y, e.w, e.h);
      if(hit){
        if(e.type === 'obstacle'){
          if(g.invuln <= 0){
            g.lives -= 1;
            g.invuln = 70;
            g.entities.splice(i,1);
            if(g.lives <= 0){ endRun('gameover'); }
            continue;
          }
        } else {
          g.coinScore += e.value;
          g.particles.push({ x:e.x, y:e.y, life:36, text:'+'+e.value });
          g.entities.splice(i,1);
          continue;
        }
      }
      if(e.x + e.w < -10) g.entities.splice(i,1);
    }

    // particles (+N)
    for(let i=g.particles.length-1;i>=0;i--){
      const pt = g.particles[i];
      pt.y -= 0.6*dt; pt.life -= dt;
      if(pt.life<=0) g.particles.splice(i,1);
    }

    if(g.distance >= FINISH_DISTANCE){ endRun('finish'); }
  }

  function drawGround(){
    ctx.strokeStyle = '#9FBFBE';
    ctx.lineWidth = 2;
    ctx.setLineDash([8,7]);
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y+2);
    ctx.lineTo(CANVAS_W, GROUND_Y+2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function draw(){
    ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
    drawGround();

    // player
    const p = g.player;
    ctx.save();
    if(g.invuln > 0 && Math.floor(g.invuln/6)%2===0){ ctx.globalAlpha = 0.35; }
    if(state.avatar === CYBORG_KEY && bzubziImg.complete && bzubziImg.naturalWidth > 0){
      const drawH = PLAYER_SIZE * 1.6;
      const drawW = drawH * (bzubziImg.naturalWidth / bzubziImg.naturalHeight);
      const dx = PLAYER_X + PLAYER_SIZE/2 - drawW/2;
      const dy = (p.y + PLAYER_SIZE) - drawH;
      ctx.drawImage(bzubziImg, dx, dy, drawW, drawH);
    } else {
      ctx.font = (PLAYER_SIZE)+'px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(state.avatar === CYBORG_KEY ? BZUBZI_EMOJI : state.avatar, PLAYER_X + PLAYER_SIZE/2, p.y + PLAYER_SIZE/2);
    }
    ctx.restore();

    // entities
    g.entities.forEach(e=>{
      ctx.font = (e.h)+'px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(e.emoji, e.x + e.w/2, e.y + e.h/2);
    });

   // Lola waits at the finish, sliding in as you get close
const remaining = FINISH_DISTANCE - g.distance;
if (remaining < 900) {
  const lolaX = CANVAS_W - 40 + (remaining / 900) * 260;

  if (lolaImg.complete && lolaImg.naturalWidth > 0) {
    const lh = 62;
    const lw = lh * (lolaImg.naturalWidth / lolaImg.naturalHeight);
    ctx.drawImage(lolaImg, lolaX - lw / 2, GROUND_Y - lh + 6, lw, lh);
  } 
    }

    // particles
    ctx.font = 'bold 13px Manrope, sans-serif';
    ctx.fillStyle = '#B0863B';
    g.particles.forEach(pt=>{
      ctx.globalAlpha = Math.max(0, pt.life/36);
      ctx.fillText(pt.text, pt.x, pt.y);
    });
    ctx.globalAlpha = 1;

    scoreEl.textContent = g.coinScore;
    livesEl.textContent = '❤️'.repeat(Math.max(0,g.lives)) + '🖤'.repeat(3-Math.max(0,g.lives));
    distEl.style.width = Math.min(100, (g.distance/FINISH_DISTANCE)*100)+'%';
  }

  function loop(t){
    const dt = Math.min((t - lastT)/16.6667, 2.2);
    lastT = t;
    update(dt);
    draw();
    if(!g.over) rafId = requestAnimationFrame(loop);
  }

  lastT = performance.now();
  rafId = requestAnimationFrame(loop);
}

function stopLoop(){
  if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
}

/* ---------------- RESULT ---------------- */
function renderResult(){
  if(!state._saved){
    leaderboard.push({ nick: state.nick || 'Player', avatar: state.avatar, score: state.score });
    leaderboard.sort((a,b)=>b.score-a.score);
    state._saved = true;
  }
  const won = g && g.result === 'finish';
  app.innerHTML = `
    <div class="screen" style="align-items:center; text-align:center; justify-content:center;">
      <span class="mascot">${won && LOLA_SRC
        ? `<span style="display:inline-flex; align-items:flex-end; justify-content:center; gap:6px;">
             ${mascotHtml(state.avatar, 72)}
             <span style="font-size:30px; align-self:center;">🖐️</span>
             <img src="${LOLA_SRC}" alt="Lola" style="height:72px; width:auto;">
           </span>`
        : mascotHtml(state.avatar, 72)}</span>
      <h1>${won ? 'Bzubzi high-fived Lola! 🖐️✨' : 'Almost there, dream-catcher!'}</h1>
      <p class="muted">${won ? 'Bzubzi flew all the way to Lola and caught so many dreams along the way. Hooray!' : 'The bumps got in the way this time — but every explorer can try again!'}</p>
      <div class="badge">${badgeFor(state.score)}</div>
      <div class="coin" style="font-size:21px; margin-bottom:6px; display:flex; align-items:center; gap:6px; justify-content:center; font-family:'Baloo 2',sans-serif; font-weight:800; color:var(--brand);">
        <span style="width:22px;height:22px;border-radius:50%;background:var(--gold);display:inline-flex;align-items:center;justify-content:center;font-size:12px;">⭐</span> ${state.score} stars
      </div>
      <div class="cta-card">
        <div class="cta-head">${ctaFor(state.score, won).head}</div>
        <p class="cta-body">${ctaFor(state.score, won).body}</p>
        <a class="btn cta-btn" href="${CONFIG.ASSESSMENT_URL}" target="_blank" rel="noopener" id="ctaRoadmap">${ctaFor(state.score, won).btn}</a>
        <div class="cta-note">Two short assessments · free · no payment required</div>
      </div>
      <div class="btn-row" style="width:100%;">
        <button class="btn secondary" id="playAgain">Play again</button>
        <button class="btn" id="seeLb">View leaderboard</button>
      </div>
    </div>`;
  if(won) confettiBurst();
  document.getElementById('playAgain').onclick = ()=>{ state.screen='play'; render(); };
  document.getElementById('seeLb').onclick = ()=>{ state.screen='leaderboard'; render(); };
}

function renderLeaderboard(){
  const rows = leaderboard.slice(0,10).map((p,i)=>{
    const isMe = state._saved && p.nick===state.nick && p.score===state.score && p.avatar===state.avatar;
    return `<tr class="${isMe?'me':''}">
      <td class="rank">${i+1}</td>
      <td style="display:flex; align-items:center; gap:6px;">${mascotHtml(p.avatar, 18)} <span>${p.nick}${isMe?' (You)':''}</span></td>
      <td class="pts">${p.score}</td>
    </tr>`;
  }).join('');
  app.innerHTML = `
    <div class="screen">
      <h2 style="text-align:center;">🏆 Top Dream-Catchers</h2>
      <p class="muted" style="text-align:center;">The best star-catching adventurers!</p>
      <table class="lb">${rows}</table>
      <div class="btn-row">
        <button class="btn secondary" id="backHome">Home</button>
        <button class="btn" id="playAgain2">Play</button>
      </div>
    </div>`;
  document.getElementById('backHome').onclick = ()=>{ state.screen='start'; render(); };
  document.getElementById('playAgain2').onclick = ()=>{ state.screen='avatar'; render(); };
}

function render(){
  stopLoop();
  if(state.screen==='start') renderStart();
  else if(state.screen==='avatar') renderAvatar();
  else if(state.screen==='play') renderPlay();
  else if(state.screen==='result') renderResult();
  else if(state.screen==='leaderboard') renderLeaderboard();
}

render();
</script>
